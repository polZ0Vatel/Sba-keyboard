name: Build Milky Nice Keyboard

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    # macos-26 идёт с Xcode 26: нужен для API Liquid Glass (iOS 26 SDK).
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app archive
        run: |
          xcodebuild \
            -project MilkyNiceKeyboard.xcodeproj \
            -scheme MilkyNiceKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/MilkyNiceKeyboard.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/MilkyNiceKeyboard.xcarchive/Products/Applications/*.app build/ipa/Payload/
          cd build/ipa
          /usr/bin/zip -r ../MilkyNiceKeyboard-unsigned.ipa Payload

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MilkyNiceKeyboard-unsigned-ipa
          path: build/MilkyNiceKeyboard-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
